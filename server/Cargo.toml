[package]
name = "kacha-server"
version = "1.1.1"
edition = "2021"

[lib]
name = "kacha_server"

[[bin]]
name = "kacha-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
imagesize = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
# 暂停时钟测上传空闲超时（#60）。
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
filetime = "0.2"
# 跨平台判断两个路径是否同一文件（硬链接去重断言，Unix 与 Windows 都跑）。
same-file = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
# 原生 Windows 服务模式（#70）：对接服务控制管理器（SCM）。
windows-service = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
